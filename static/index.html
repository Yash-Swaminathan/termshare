<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>termshare</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.min.css" />
  <style>
    html, body { margin: 0; height: 100%; background: #000; color: #ddd;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    body { display: flex; flex-direction: column; }
    #bar { display: flex; align-items: center; gap: 12px; padding: 6px 10px;
      background: #111; border-bottom: 1px solid #222; font-size: 13px; }
    #status { flex: 1; }
    #status .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%;
      margin-right: 6px; background: #666; vertical-align: middle; }
    #status.host .dot { background: #3fb950; }
    #status.write .dot { background: #d29922; }
    #toggle { display: none; background: #21262d; color: #ddd; border: 1px solid #30363d;
      border-radius: 6px; padding: 5px 10px; font: inherit; cursor: pointer; }
    #toggle:hover { background: #30363d; }
    #term { flex: 1; padding: 4px; min-height: 0; }
  </style>
</head>
<body>
  <div id="bar">
    <span id="status"><span class="dot"></span><span id="statusText">connecting...</span></span>
    <button id="toggle"></button>
  </div>
  <div id="term"></div>

  <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.min.js"></script>
  <script>
    const term = new Terminal({ cursorBlink: true });
    const fitAddon = new FitAddon.FitAddon();
    term.loadAddon(fitAddon);
    term.open(document.getElementById('term'));
    fitAddon.fit();
    term.write('connecting...\r\n');

    const statusEl = document.getElementById('status');
    const statusText = document.getElementById('statusText');
    const toggle = document.getElementById('toggle');

    // Role state; the server is authoritative.
    let isHost = false;
    let canWrite = false;
    let viewersCanWrite = false;

    const key = new URLSearchParams(location.search).get('key');
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    const ws = new WebSocket(proto + '://' + location.host + '/ws' + (key ? '?key=' + encodeURIComponent(key) : ''));
    ws.binaryType = 'arraybuffer';

    ws.onopen  = () => term.write('\r\n[connected]\r\n');
    ws.onclose = () => { term.write('\r\n[disconnected]\r\n'); render(); };

    ws.onmessage = (ev) => {
      // Text = JSON control, binary = pty output.
      if (typeof ev.data === 'string') {
        handleControl(ev.data);
        return;
      }
      term.write(new Uint8Array(ev.data));
    };

    function handleControl(raw) {
      let msg;
      try { msg = JSON.parse(raw); } catch (e) { return; }
      if (msg.type === 'role') {
        isHost = msg.role === 'host';
        canWrite = !!msg.canWrite;
        viewersCanWrite = !!msg.viewersCanWrite;
        render();
        sendResize();
      }
    }

    function render() {
      statusEl.classList.remove('host', 'write');
      if (isHost) {
        statusEl.classList.add('host');
        statusText.textContent = 'host \u00b7 you can type';
        toggle.style.display = 'inline-block';
        toggle.textContent = viewersCanWrite ? 'Lock viewers (read-only)' : 'Allow viewers to type';
      } else {
        toggle.style.display = 'none';
        if (canWrite) {
          statusEl.classList.add('write');
          statusText.textContent = 'viewer \u00b7 writing enabled';
        } else {
          statusText.textContent = 'viewer \u00b7 read-only';
        }
      }
    }

    toggle.addEventListener('click', () => {
      if (!isHost) return;
      ws.send(JSON.stringify({ type: 'set_acl', viewersWrite: !viewersCanWrite }));
    });

    term.onData((d) => {
      if (canWrite && ws.readyState === WebSocket.OPEN) ws.send(d);
    });

    function sendResize() {
      if (!isHost || ws.readyState !== WebSocket.OPEN) return;
      ws.send(JSON.stringify({ type: 'resize', cols: term.cols, rows: term.rows }));
    }

    term.onResize(() => sendResize());
    window.addEventListener('resize', () => fitAddon.fit());
  </script>
</body>
</html>
