<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>termshare</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.min.css" />
  <style>
    html, body { margin: 0; height: 100%; background: #000; }
    #term { height: 100%; padding: 4px; }
  </style>
</head>
<body>
  <div id="term"></div>

  <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.min.js"></script>
  <script>
    // xterm.js = a terminal emulator in the browser. It turns the raw
    // ANSI escape bytes from the PTY back into a visible terminal.
    const term = new Terminal({ cursorBlink: true });
    term.open(document.getElementById('term'));
    term.write('connecting...\r\n');

    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    const ws = new WebSocket(proto + '://' + location.host + '/ws');
    ws.binaryType = 'arraybuffer';

    ws.onopen  = () => term.write('\r\n[connected]\r\n');
    ws.onclose = () => term.write('\r\n[disconnected]\r\n');

    // Shell output -> screen.
    ws.onmessage = (ev) => {
      const data = typeof ev.data === 'string'
        ? ev.data
        : new Uint8Array(ev.data);
      term.write(data);
    };

    // Keystrokes -> shared shell.
    term.onData((d) => ws.send(d));
  </script>
</body>
</html>
